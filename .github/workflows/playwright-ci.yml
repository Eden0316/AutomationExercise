name: Playwright CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "playwright/**"
      - ".github/workflows/playwright-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "playwright/**"
      - ".github/workflows/playwright-ci.yml"

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  playwright-test:
    name: Run Playwright CI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Playwright CI smoke tests
        run: npx playwright test tests/05_e2e/01_user-purchase-lite.e2e.spec.js --project=chromium --workers=1 --timeout=60000

      - name: Ensure artifact directories exist
        if: always()
        run: |
          mkdir -p playwright-report
          mkdir -p test-results

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report
          path: playwright/playwright-report
          retention-days: 14

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: playwright/test-results
          retention-days: 14