name: Playwright CI

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select Playwright test suite"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
  push:
    branches:
      - main
    paths:
      - "playwright/**"
      - ".github/workflows/playwright-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "playwright/**"
      - ".github/workflows/playwright-ci.yml"

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  playwright-test:
    name: Run Playwright CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve Playwright test suite
        id: resolve-suite
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_SUITE="${{ github.event.inputs.test_suite }}"
          else
            TEST_SUITE="smoke"
          fi

          if [ "$TEST_SUITE" = "full" ]; then
            TEST_COMMAND="npx playwright test --project=chromium --workers=1 --timeout=60000"
          else
            TEST_COMMAND="npx playwright test tests/05_e2e/01_user-purchase-lite.e2e.spec.js --project=chromium --workers=1 --timeout=60000"
          fi

          echo "test_suite=$TEST_SUITE" >> "$GITHUB_OUTPUT"
          echo "test_command=$TEST_COMMAND" >> "$GITHUB_OUTPUT"

          echo "Resolved test suite: $TEST_SUITE"
          echo "Resolved test command: $TEST_COMMAND"

      - name: Run Playwright tests
        run: ${{ steps.resolve-suite.outputs.test_command }}

      - name: Ensure artifact directories exist
        if: always()
        run: |
          mkdir -p playwright-report
          mkdir -p test-results

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report-${{ steps.resolve-suite.outputs.test_suite }}
          path: playwright/playwright-report
          retention-days: 14

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results-${{ steps.resolve-suite.outputs.test_suite }}
          path: playwright/test-results
          retention-days: 14
          if-no-files-found: ignore